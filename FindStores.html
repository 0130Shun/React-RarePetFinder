<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稀寵搜搜-搜尋頁</title>
    <link rel="stylesheet" href="./src/styles/main.scss">
</head>
<body>
  <div class="container ui-container">
    <div class="row">
      <div class="col-12 d-md-none p-3">
        <div class="search mb-36 mobile-search">
          <div class="d-flex justify-content-between ">
            <span class="span-style">搜尋</span>
            <button type="button" class="fw-bold shadow-sm btn-style" data-bs-toggle="offcanvas" data-bs-target="#searchOffcanvas">
              進階篩選<img src="./src/assets/sliders.png" alt=""> 
            </button>
          </div>
          <div class="search-group mt-12">
            <div class="search-bar text">
              <input type="text" placeholder="搜尋關鍵字">
              <button type="button">
                <img src="./src/assets/search.svg" alt="">
              </button>
            </div>
            <div class="search-button">
              <button type="button">重置</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <aside class="col-lg-3">
        <div class="offcanvas-lg offcanvas-top h-100" tabindex="-1" id="searchOffcanvas">
          <!-- 彈跳視窗上方 -->
          <div class="offcanvas-header d-lg-none">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#searchOffcanvas"></button>
          </div>
          <!-- 彈跳視窗內容 -->
          <div class="offcanvas-body sidebar-sticky">
            <div class="p-3 w-100">
              <!-- 搜尋關鍵字 -->
              <div class="search mb-36">
                <span class="span-style">搜尋</span>
                <div class="search-group mt-12">
                  <div class="search-bar tc-1-small-regular">
                    <input type="text" placeholder="搜尋關鍵字">
                    <button type="button">
                      <img src="./src/assets/search.svg" alt="">
                    </button>
                  </div>
                  <div class="search-button">
                    <button type="button">重置</button>
                  </div>
                </div>
              </div>
              <!-- 縣市 -->
              <div class="city mb-36">
                <span class="span-style">縣市</span>
                  <div class="mt-12 city-select">
                    <select class="form-select form-select-lg select-arrow tc-1-small-regular" aria-label=".form-select-lg example">
                      <option selected>請選擇縣市</option>
                      <option value="1">台北</option>
                      <option value="2">台中</option>
                      <option value="3">高雄</option>
                    </select>
                  </div>
              </div>
              <!-- 鄉鎮市區 -->
              <div class="township mb-36">
                <span class="span-style">鄉鎮地區</span>
                <div class="mt-12 township-select">
                  <select class="form-select form-select-lg select-arrow" aria-label=".form-select-lg example">
                      <option selected>請選擇鄉鎮地區</option>
                      <option value="1">大同區</option>
                      <option value="2">神岡區</option>
                      <option value="3">三民區</option>
                  </select>
                </div>
              </div>
              <!-- 店家種類 -->
              <div class="storeTypes mb-36">
                <span class="span-style">店家種類</span>
                <div class="mt-12">
                  <div class="clinicCheckbox">
                    <input class="form-check-input checkbox-input" type="checkbox" id="clinicCheck">
                    <label class="form-check-label checkbox-label" for="clinicCheck">診所</label>
                  </div>
                  <div class="hostelCheckbox mt-12">
                    <input class="form-check-input checkbox-input" type="checkbox" id="hostelCheck">
                    <label class="form-check-label checkbox-label" for="hostelCheck">旅館</label>
                  </div>
                  <div class="legitimateStoresCheckbox mt-12">
                    <input class="form-check-input checkbox-input" type="checkbox" id="legitimateStoresCheck">
                    <label class="form-check-label checkbox-label" for="legitimateStoresCheck">合法店家</label>
                  </div>
                </div>
              </div>
              <!-- 寵物種類 -->
              <div class="petTypes mb-36">
                <span class="span-style">寵物種類</span>
                <div class="mt-12">
                  <div class="parrotCheckbox">
                    <input class="form-check-input checkbox-input" type="checkbox" id="parrotCheck">
                    <label class="form-check-label checkbox-label" for="parrotCheck">鸚鵡</label>
                  </div>
                  <div class="callDuckCheckbox mt-12">
                        <input class="form-check-input checkbox-input" type="checkbox" id="callDuckCheck">
                        <label class="form-check-label checkbox-label" for="callDuckCheck">柯爾鴨</label>
                  </div>
                  <div class="turtleCheckbox mt-12">
                        <input class="form-check-input checkbox-input" type="checkbox" id="turtleCheck">
                        <label class="form-check-label checkbox-label" for="turtleCheck">烏龜</label>
                  </div>
                  <div class="geckoCheckbox mt-12">
                        <input class="form-check-input checkbox-input" type="checkbox" id="geckoCheck">
                        <label class="form-check-label checkbox-label" for="geckoCheck">守宮</label>
                  </div>
                  <div class="hedgehogCheckbox mt-12">
                        <input class="form-check-input checkbox-input" type="checkbox" id="hedgehogCheck">
                        <label class="form-check-label checkbox-label" for="hedgehogCheck">刺蝟</label>
                  </div>
                  <div class="thamsterCheckbox mt-12">
                        <input class="form-check-input checkbox-input" type="checkbox" id="hamsterCheck">
                        <label class="form-check-label checkbox-label" for="hamsterCheck">倉鼠</label>
                  </div>
                </div>
              </div>
              <!-- 搜尋按鈕 -->
              <div class="search-btn">
                <button type="button">搜尋</button>
              </div>
            </div>
          </div>
        </div>
      </aside>
      <main class="col-lg-9 text-center text-lg-start">
        <span class="searchResults text-center text-lg-start">搜尋結果</span>
        <div class="row g-3 mt-16">
          <div class="col-6 col-lg-4">
            <div class="card card-style">
              <div class="love">
                <button type="button">
                  <img src="./src/assets/love.png" alt="">
                </button>
                <span>123</span>
              </div>
              <div class="card-img mb-24">
                <img src="./src/assets/Clinic.png" alt="">
              </div>
              <div class="cardName mb-12 text-center text-lg-start">
                <span>侏鑼紀野生動物専科醫院</span>
              </div>
              <div class="industry mb-6 text-center text-lg-start">
                  <span class="d-none d-lg-inline">店家類型：</span><span>診所</span>
              </div>
              <div class="area text-center text-lg-start">
                <span class="d-none d-lg-inline">地區：</span><span>台中市西區</span>
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-4">
            <div class="card card-style">
              <div class="love">
                <button type="button">
                  <img src="./src/assets/love.png" alt="">
                </button>
                <span>123</span>
              </div>
              <div class="card-img mb-24 c">
                <img src="./src/assets/Clinic.png" alt="">
              </div>
              <div class="cardName mb-12 text-center text-lg-start">
                <span>侏鑼紀野生動物専科醫院</span>
              </div>
              <div class="industry mb-6 text-center text-lg-start">
                  <span class="d-none d-lg-inline">店家類型：</span><span>診所</span>
              </div>
              <div class="area text-center text-lg-start">
                <span class="d-none d-lg-inline">地區：</span><span>台中市西區</span>
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-4">
            <div class="card card-style">
              <div class="love">
                <button type="button">
                  <img src="./src/assets/love.png" alt="">
                </button>
                <span>123</span>
              </div>
              <div class="card-img mb-24 c">
                <img src="./src/assets/Clinic.png" alt="">
              </div>
              <div class="cardName mb-12 text-center text-lg-start">
                <span>侏鑼紀野生動物専科醫院</span>
              </div>
              <div class="industry mb-6 text-center text-lg-start">
                  <span class="d-none d-lg-inline">店家類型：</span><span>診所</span>
              </div>
              <div class="area text-center text-lg-start">
                <span class="d-none d-lg-inline">地區：</span><span>台中市西區</span>
              </div>
            </div>
          </div>
          <div class="col-6 col-lg-4">
            <div class="card card-style">
              <div class="love">
                <button type="button">
                  <img src="./src/assets/love.png" alt="">
                </button>
                <span>123</span>
              </div>
              <div class="card-img mb-24 c">
                <img src="./src/assets/Clinic.png" alt="">
              </div>
              <div class="cardName mb-12 text-center text-lg-start">
                <span>侏鑼紀野生動物専科醫院</span>
              </div>
              <div class="industry mb-6 text-center text-lg-start">
                  <span class="d-none d-lg-inline">店家類型：</span><span>診所</span>
              </div>
              <div class="area text-center text-lg-start">
                <span class="d-none d-lg-inline">地區：</span><span>台中市西區</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
